[build-system]
requires = [
    'setuptools==80.9.0',
    'build==1.3.0',
    'wheel==0.45.1'
]
build-backend = 'setuptools.build_meta'

[project]
name = "kaso-mashin"
description = "Building a mini-cloud as a playground"
urls = { "Sources" = "https://github.com/MrMatAP/kaso-mashin" }
keywords = ["mac", "virtualization", "virtualisation", "arm64"]
readme = "README.md"
license = { text = "MIT" }
authors = [
    { "name" = "Mathieu Imfeld", "email" = "imfeldma+9jqerw@gmail.com" }
]
maintainers = [
    { "name" = "Mathieu Imfeld", "email" = "imfeldma+9jqerw@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT",
    "Programming Language :: Python :: 3.13"
]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "rich==14.2.0",
    "requests==2.32.5",
    "pyyaml==6.0.3",
    "netifaces==0.11.0",
    "aiosqlite==0.21.0",
    "sqlalchemy[asyncio]==2.0.44",
    "websockets==15.0.1",
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
    "httpx[http2]==0.28.1",
    "aiofiles==25.1.0",
    "qemu-qmp==0.0.5",
    "passlib==1.7.4",
    "aioconsole==0.8.2",
    "jinja2==3.1.6",
    "asyncio-events==0.1.4",
    "telnetlib3==2.0.8"
]
[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest_asyncio==0.25.0",
    "pytest_httpserver==1.1.0",
    "types-PyYAML==6.0.12.20240311",
    "types-aiofiles==24.1.0.20240626",
    "types-passlib==1.7.7.20240327",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kaso_mashin"]
exclude = ["frontend"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "ci.version"}

[project.scripts]
kaso = "kaso_mashin.cli.run:main"
kaso-server = "kaso_mashin.server.run:main"

# If you are debugging your tests using PyCharm then comment out the coverage options
# in addopts
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=kaso_mashin --cov-report=term --cov-report=xml:build/coverage.xml --junit-xml=build/junit.xml"
testpaths = ["tests"]
junit_family = "xunit2"
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format="%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope='session'

[tool.mypy]
plugins = [ 'pydantic.mypy' ]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv.workspace]
exclude = ["frontend"]
